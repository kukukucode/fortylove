allowBuilds:
  '@sentry/cli': false
  sharp: true
  unrs-resolver: false

overrides:
  # Next's plugin only uses globSync(pattern, { onlyDirectories: true }).
  # tinyglobby removes braces; the pinned patch disables its directory expansion
  # to preserve fast-glob semantics. Compatibility tests exercise this boundary.
  '@next/eslint-plugin-next@15.5.28>fast-glob': npm:tinyglobby@0.2.17
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'nanoid@<3.3.18': 3.3.18
  postcss: 8.5.28
  'sharp@<0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'vite@>=8.2.0 <8.2.4': 8.2.4

patchedDependencies:
  '@next/eslint-plugin-next@15.5.28': patches/@next__eslint-plugin-next@15.5.28.patch
