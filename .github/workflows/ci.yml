name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortylove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortylove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fortylove_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/classify-ci-changes.sh
      - name: Skip database integration for low-risk changes
        if: steps.changes.outputs.database != 'true'
        run: echo "No database-sensitive changes detected."
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -c "create role service_role noinherit"
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/storage_stub.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/inspect_current.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/manual/production_upgrade_20260905.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/verify_production.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260906_chatbot_experience.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/chatbot_experience.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260906_operations_quality.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/operations_quality.sql
      - if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_quality.sql
      - name: Prepare reservation concurrency test
        if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reservation_concurrency_setup.sql
      - name: Race 20 reservations for one remaining seat
        if: steps.changes.outputs.database == 'true'
        run: |
          seq -w 000000000001 000000000020 | xargs -P 20 -I {} \
            psql -v ON_ERROR_STOP=1 -Atc "select public.reserve_event('20000000-0000-0000-0000-{}'::uuid, '10000000-0000-0000-0000-000000000001'::uuid)"
      - name: Verify reservation capacity after concurrency
        if: steps.changes.outputs.database == 'true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reservation_concurrency_assert.sql

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortylove_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortylove_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fortylove_quality
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/classify-ci-changes.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Playwright Chromium
        if: steps.changes.outputs.heavy_verify == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        if: steps.changes.outputs.heavy_verify == 'true'
        run: pnpm test:e2e:smoke
      - name: Check chatbot and FAQ on desktop and mobile
        if: steps.changes.outputs.heavy_verify == 'true'
        run: pnpm test:e2e:experience
      - name: Install pinned PostgREST for real database E2E
        if: steps.changes.outputs.heavy_verify == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/PostgREST/postgrest/releases/download/v12.2.12/postgrest-v12.2.12-linux-static-x86-64.tar.xz --output "$RUNNER_TEMP/postgrest.tar.xz"
          mkdir "$RUNNER_TEMP/fortylove-postgrest"
          tar -xf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/fortylove-postgrest"
          echo "$RUNNER_TEMP/fortylove-postgrest" >> "$GITHUB_PATH"
      - name: Create isolated test fixtures (missing setup fails CI)
        if: steps.changes.outputs.heavy_verify == 'true'
        run: pnpm test:quality:setup
      - name: Install PostgreSQL 17 restore tools
        if: steps.changes.outputs.heavy_verify == 'true'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Production build, required business E2E, accessibility and measured SLO
        if: steps.changes.outputs.heavy_verify == 'true'
        run: pnpm test:quality
      - name: Backup and restore rehearsal in a separate local database
        if: steps.changes.outputs.heavy_verify == 'true'
        run: node scripts/quality/restore-drill.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.heavy_verify == 'true'
        with:
          name: quality-measurements
          path: .ops-reports/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
